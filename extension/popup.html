<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>ViDow Studio Helper</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-light: #f8f5f9;
      --bg-dark: #0e0a19;
      --surface-light: #ffffff;
      --surface-dark: #181229;
      --border-light: #e4dbee;
      --border-dark: #312450;
      --text-light: #161024;
      --text-dark: #f6f3fa;
      --muted-light: #645878;
      --muted-dark: #a599bc;
      --brand-light: #e11d58;
      --brand-dark: #fb7185;
      --brand2-light: #7c3aed;
      --brand2-dark: #a78bfa;
      --success-light: #059669;
      --success-dark: #34d399;
      --danger-light: #dc2626;
      --danger-dark: #fb7185;

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --border: var(--border-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --brand: var(--brand-light);
      --brand2: var(--brand2-light);
      --success: var(--success-light);
      --danger: var(--danger-light);

      @media (prefers-color-scheme: dark) {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --border: var(--border-dark);
        --text: var(--text-dark);
        --muted: var(--muted-dark);
        --brand: var(--brand-dark);
        --brand2: var(--brand2-dark);
        --success: var(--success-dark);
        --danger: var(--danger-dark);
      }

      @supports (color: light-dark(white, black)) {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --brand: light-dark(var(--brand-light), var(--brand-dark));
        --brand2: light-dark(var(--brand2-light), var(--brand2-dark));
        --success: light-dark(var(--success-light), var(--success-dark));
        --danger: light-dark(var(--danger-light), var(--danger-dark));
      }
    }

    :where(body, div, span, select, button, label, img) {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 372px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-row img {
      border-radius: 7px;
    }

    .title {
      font-weight: 750;
      font-size: 14.5px;
      letter-spacing: -0.02em;
    }

    .status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .tab-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }

    .tab-title {
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .tab-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 650;
    }

    select {
      width: 100%;
      padding: 6.5px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    .btn {
      width: 100%;
      padding: 8.5px 10px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-weight: 650;
      font-size: 12.5px;
      cursor: pointer;
      margin-bottom: 6px;
      text-align: center;
      transition: filter 0.15s ease, border-color 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--brand);
    }

    .streams-title {
      font-size: 11.5px;
      font-weight: 650;
      color: var(--muted);
      margin: 8px 0 5px;
    }

    .streams-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 145px;
      overflow-y: auto;
    }

    .stream-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
    }

    .stream-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .btn-mini {
      padding: 4px 8px;
      border-radius: 6px;
      border: 0;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #ffffff;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      flex-shrink: 0;
    }

    .feedback {
      font-size: 11.5px;
      margin-top: 6px;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-row">
      <img src="icons/icon-48.png" alt="" width="24" height="24">
      <span class="title">ViDow Studio</span>
    </div>
    <span id="server-status" class="status">Prüfe App…</span>
  </div>

  <div class="tab-box">
    <div id="tab-title" class="tab-title">Aktueller Tab</div>
    <div id="tab-url" class="tab-url">https://…</div>
  </div>

  <div class="row">
    <div>
      <label for="ext-quality">Qualität</label>
      <select id="ext-quality" name="quality">
        <option value="best">Beste (Auto)</option>
        <option value="2160">4K (2160p)</option>
        <option value="1440">2K (1440p)</option>
        <option value="1080">Full HD (1080p)</option>
        <option value="720">HD (720p)</option>
        <option value="540">qHD (540p)</option>
        <option value="480">SD (480p)</option>
        <option value="360">Kompakt (360p)</option>
        <option value="240">Niedrig (240p)</option>
        <option value="audio">Nur Audio (MP3)</option>
      </select>
    </div>
    <div>
      <label for="ext-codec">Codec</label>
      <select id="ext-codec" name="codec">
        <option value="auto">Auto</option>
        <option value="h264">H.264 (MP4)</option>
        <option value="h265">H.265 (HEVC)</option>
        <option value="vp9">VP9</option>
        <option value="av1">AV1</option>
      </select>
    </div>
  </div>

  <button type="button" id="btn-send-page" class="btn btn-primary">
    Video dieser Seite herunterladen
  </button>

  <button type="button" id="btn-skip-ad" class="btn btn-secondary">
    Laufende Pre-Roll-Werbung überspringen
  </button>

  <button type="button" id="btn-open-dashboard" class="btn btn-secondary">
    ViDow Studio öffnen
  </button>

  <div class="streams-title">Erkannte Direkt-Streams im Tab:</div>
  <div id="streams-list" class="streams-list">
    <div class="tab-url">Noch keine direkten .m3u8/.mp4 Streams erkannt.</div>
  </div>

  <div id="feedback" class="feedback"></div>

  <script src="popup.js"></script>
</body>
</html>
