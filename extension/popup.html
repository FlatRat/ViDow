<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>ViDow Browser-Helper</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f3f6fb;
      --border: #d8e0ed;
      --text: #111827;
      --muted: #5b667a;
      --brand: #2563eb;
      --brand-text: #ffffff;
      --success: #15803d;
      --danger: #dc2626;

      @media (prefers-color-scheme: dark) {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #2f3744;
        --text: #f0f6fc;
        --muted: #8b949e;
        --brand: #58a6ff;
        --brand-text: #081226;
        --success: #3fb950;
        --danger: #f85149;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 360px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-weight: 700;
      font-size: 15px;
    }

    .status {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .tab-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .tab-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .tab-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
    }

    .btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      margin-bottom: 6px;
      text-align: center;
    }

    .btn-primary {
      background: var(--brand);
      color: var(--brand-text);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .streams-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      margin: 8px 0 5px;
    }

    .streams-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 150px;
      overflow-y: auto;
    }

    .stream-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
    }

    .stream-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .btn-mini {
      padding: 4px 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--brand);
      color: var(--brand-text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .feedback {
      font-size: 11.5px;
      margin-top: 6px;
      min-height: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">🎬 ViDow Helper</span>
    <span id="server-status" class="status">Prüfe Server…</span>
  </div>

  <div class="tab-box">
    <div id="tab-title" class="tab-title">Aktueller Tab</div>
    <div id="tab-url" class="tab-url">https://…</div>
  </div>

  <div class="row">
    <div>
      <label for="ext-quality">Qualität</label>
      <select id="ext-quality">
        <option value="best">Beste (Auto)</option>
        <option value="2160">4K (2160p)</option>
        <option value="1080">Full HD (1080p)</option>
        <option value="720">HD (720p)</option>
        <option value="audio">Nur Audio (MP3)</option>
      </select>
    </div>
    <div>
      <label for="ext-codec">Codec</label>
      <select id="ext-codec">
        <option value="auto">Auto</option>
        <option value="h264">H.264 (Mac/MP4)</option>
        <option value="h265">H.265 (HEVC)</option>
        <option value="vp9">VP9</option>
        <option value="av1">AV1</option>
      </select>
    </div>
  </div>

  <button type="button" id="btn-send-page" class="btn btn-primary">
    ⬇ Video dieser Seite herunterladen
  </button>

  <button type="button" id="btn-skip-ad" class="btn btn-secondary">
    ⚡ Laufende Pre-Roll-Werbung im Tab überspringen
  </button>

  <button type="button" id="btn-open-dashboard" class="btn btn-secondary">
    🖥️ ViDow Dashboard öffnen
  </button>

  <div class="streams-title">Erkannte Direkt-Streams im Tab (ohne Werbung):</div>
  <div id="streams-list" class="streams-list">
    <div class="tab-url">Noch keine direkten .m3u8/.mp4 Streams erkannt.</div>
  </div>

  <div id="feedback" class="feedback"></div>

  <script src="popup.js"></script>
</body>
</html>
